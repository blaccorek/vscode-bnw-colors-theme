# Sample Docker Compose file.
name: bnw-stack

x-common: &common
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  api:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        NODE_VERSION: "20"
      cache_from:
        - ghcr.io/blaccorek/api:cache
    image: ghcr.io/blaccorek/api:1.4.2
    command: ["node", "dist/server.js", "--port", "8080"]
    ports:
      - "8080:8080"
      - "127.0.0.1:9229:9229"
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://api:${POSTGRES_PASSWORD:?required}@db:5432/api
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.25", memory: 128M }

  db:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: api
      POSTGRES_DB: api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api -d api"]
      interval: 10s
      retries: 5

  cache:
    <<: *common
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - cachedata:/data

volumes:
  pgdata: {}
  cachedata:
    driver: local

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
