; Sample INI configuration file.
[DEFAULT]
environment = production
log_level = info
retries = 3

[server]
host = 0.0.0.0
port = 8080
workers = 4
enable_tls = yes

[database]
url = postgres://api:secret@localhost:5432/api
pool_size = 16
# timeouts are in milliseconds
connect_timeout = 5000
statement_timeout = 30000

[cache]
backend = redis
url = redis://localhost:6379/0
ttl = 300
prefix = bnw:

[features]
tracing = false
async_writes = true
beta_users = ada,grace,alan
