name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve version
        id: version
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json version '$version' is not a valid x.y.z version"
            exit 1
          fi
          if [ -n "$TAG_NAME" ] && [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::tag '$TAG_NAME' does not match package.json version '$version' (expected tag v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=vscode-bnw-colors-theme-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          notes="$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::warning::No '## [$VERSION]' section found in CHANGELOG.md"
            notes="Release $VERSION"
          fi
          {
            echo 'notes<<EOF'
            printf '%s\n' "$notes"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npx --yes '@vscode/vsce@^3' package --out '${{ steps.version.outputs.vsix }}'

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          npx --yes '@vscode/vsce@^3' publish --packagePath '${{ steps.version.outputs.vsix }}'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VSIX: ${{ steps.version.outputs.vsix }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$VSIX" --clobber
          else
            printf '%s\n' "$NOTES" > notes.md
            gh release create "$tag" "$VSIX" --title "$tag" --notes-file notes.md
          fi

      - name: Upload vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}
